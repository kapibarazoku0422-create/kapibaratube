<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}カピバラチューブ{% endblock %}</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f0f;
  --bg2: #1a1a1a;
  --bg3: #272727;
  --text: #f1f1f1;
  --text2: #aaa;
  --text3: #717171;
  --accent: #ff0000;
  --border: #3f3f3f;
  --r: 8px;
  --trans: 0.15s ease;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans JP', 'Segoe UI', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== トップバー ===== */
#top-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 500;
  height: 56px;
  background: rgba(15,15,15,0.97);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid #222;
  display: flex; align-items: center;
  padding: 0 16px; gap: 12px;
  transition: transform 0.3s ease;
}
#top-bar.hidden-bar { transform: translateY(-100%); }

/* ロゴ（虹色） */
#logo {
  font-size: clamp(17px, 3.5vw, 24px);
  font-weight: 900;
  letter-spacing: 1px;
  cursor: pointer;
  background: linear-gradient(90deg,#ff0000,#ff7700,#ffee00,#00cc44,#0088ff,#aa00ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  white-space: nowrap;
  flex-shrink: 0;
  text-decoration: none;
  user-select: none;
}

/* 検索バー */
#header-search-wrap {
  display: flex; flex: 1; max-width: 560px; margin: 0 auto;
  background: var(--bg3);
  border-radius: 24px; overflow: hidden;
  border: 1.5px solid var(--border);
  transition: border var(--trans);
}
#header-search-wrap:focus-within { border-color: #888; }
#searchbox {
  flex: 1; background: transparent; border: none; outline: none;
  padding: 8px 16px; color: var(--text); font-size: 14px;
}
#search-submit {
  background: var(--bg3); border: none;
  padding: 0 16px; cursor: pointer;
  color: var(--text2); font-size: 15px;
  border-left: 1px solid var(--border);
  transition: color var(--trans);
}
#search-submit:hover { color: var(--text); }

/* ヘッダーボタン群 */
.hdr-btn {
  background: none; border: 1.5px solid var(--border);
  color: var(--text2); padding: 6px 12px; border-radius: var(--r);
  cursor: pointer; font-size: 13px; white-space: nowrap;
  transition: all var(--trans); flex-shrink: 0;
}
.hdr-btn:hover { background: var(--bg3); color: var(--text); }

/* ヘッダー復元ボタン */
#show-header-btn {
  position: fixed; top: 10px; left: 10px; z-index: 499;
  background: rgba(30,30,30,0.9); border: 1.5px solid var(--border);
  color: var(--text); width: 34px; height: 34px; border-radius: 50%;
  cursor: pointer; display: none; align-items: center; justify-content: center;
  backdrop-filter: blur(8px);
}

/* ===== サイドパネル（メニュー・設定） ===== */
.side-panel {
  position: fixed; top: 0; right: -300px; width: 300px; height: 100%;
  background: rgba(20,20,20,0.97);
  backdrop-filter: blur(20px);
  z-index: 600;
  box-shadow: -5px 0 30px rgba(0,0,0,0.5);
  transition: right 0.35s cubic-bezier(0.165,0.84,0.44,1);
  padding: 24px 20px;
  border-left: 1px solid var(--border);
}
.side-panel.open { right: 0; }
.panel-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 24px; padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.panel-header h2 { font-size: 16px; color: var(--text); }
.panel-close {
  background: none; border: none; color: var(--text2);
  font-size: 18px; cursor: pointer; padding: 4px 8px;
  transition: color var(--trans);
}
.panel-close:hover { color: var(--text); }

.menu-list { list-style: none; }
.menu-list li { margin-bottom: 6px; }
.menu-list a {
  display: flex; align-items: center;
  padding: 12px 16px; color: var(--text);
  text-decoration: none; border-radius: 10px;
  font-weight: 600; font-size: 14px;
  background: rgba(255,255,255,0.03);
  transition: all var(--trans);
}
.menu-list a:hover {
  background: var(--accent); color: #fff;
  transform: scale(1.02);
}
.menu-list i {
  width: 28px; height: 28px; margin-right: 12px;
  font-size: 16px; display: flex; align-items: center; justify-content: center;
  border-radius: 7px; background: rgba(255,255,255,0.06);
  flex-shrink: 0;
}
.menu-list a:hover i { background: rgba(255,255,255,0.15); }

/* ===== Status通知 ===== */
#status-notif {
  position: fixed; top: 68px; right: 16px; z-index: 450;
  width: 280px; background: var(--bg2);
  border: 1.5px solid var(--border); border-left: 4px solid var(--accent);
  border-radius: 10px; padding: 14px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  transition: transform 0.2s ease, opacity 0.2s ease;
  cursor: grab;
}
#status-notif:active { cursor: grabbing; }
.notif-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px;
}
.notif-header h3 { font-size: 12px; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; }
.notif-close {
  background: none; border: none; color: var(--text3);
  font-size: 14px; cursor: pointer; transition: color var(--trans);
}
.notif-close:hover { color: var(--text); }
#notif-content { font-size: 13px; color: var(--text2); line-height: 1.5; }

/* ===== スクロールバー ===== */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #666; }

/* ===== オーバーレイ ===== */
#overlay {
  display: none; position: fixed; inset: 0; z-index: 550;
  background: rgba(0,0,0,0.5);
}
#overlay.show { display: block; }

{% block extra_style %}{% endblock %}
</style>
</head>
<body>

<!-- ヘッダー復元ボタン -->
<button id="show-header-btn" title="ヘッダー表示"><i class="fas fa-chevron-down"></i></button>

<!-- トップバー -->
<div id="top-bar">
  <a id="logo" href="/">🐹カピバラチューブ</a>

  <form id="search-form" action="/search" method="get" style="display:flex;flex:1;max-width:560px;margin:0 auto">
    <div id="header-search-wrap" style="width:100%">
      <input id="searchbox" name="q" type="search" placeholder="動画・チャンネルを検索..."
             autocomplete="off" spellcheck="false"
             value="{{ request.query_params.get('q', '') }}">
      <button id="search-submit" type="submit"><i class="fas fa-search"></i></button>
    </div>
  </form>

  <button class="hdr-btn" onclick="document.getElementById('top-bar').classList.add('hidden-bar');document.getElementById('show-header-btn').style.display='flex'">
    <i class="fas fa-eye-slash"></i>
  </button>
  <button class="hdr-btn" onclick="openPanel('menu-panel')"><i class="fas fa-bars"></i></button>
</div>

<!-- オーバーレイ -->
<div id="overlay" onclick="closePanels()"></div>

<!-- メニューパネル -->
<div id="menu-panel" class="side-panel">
  <div class="panel-header">
    <h2><i class="fas fa-th-large"></i> メニュー</h2>
    <button class="panel-close" onclick="closePanels()"><i class="fas fa-times"></i></button>
  </div>
  <ul class="menu-list">
    <li><a href="/"><i class="fas fa-home"></i>ホーム</a></li>
    <li><a href="/history"><i class="fas fa-history"></i>視聴履歴</a></li>
    <li><a href="/search?q=ライブ配信&type=video"><i class="fas fa-circle" style="color:#ff0000"></i>ライブ</a></li>
    <li><a href="/search?q=shorts&type=short"><i class="fas fa-mobile-alt"></i>ショート</a></li>
    <li><a href="/status"><i class="fas fa-chart-line"></i>稼働状況</a></li>
  </ul>
</div>

<!-- Status通知 -->
<div id="status-notif">
  <div class="notif-header">
    <h3><i class="fas fa-bell"></i> Status</h3>
    <button class="notif-close" onclick="hideNotif()"><i class="fas fa-times"></i></button>
  </div>
  <div id="notif-content">🐹 カピバラチューブへようこそ！</div>
</div>

<!-- メインコンテンツ -->
<div style="padding-top: 56px;">
  {% block content %}{% endblock %}
</div>

<script>
// ===== パネル開閉 =====
function openPanel(id) {
  closePanels();
  document.getElementById(id).classList.add('open');
  document.getElementById('overlay').classList.add('show');
}
function closePanels() {
  document.querySelectorAll('.side-panel').forEach(p => p.classList.remove('open'));
  document.getElementById('overlay').classList.remove('show');
}

// ===== ヘッダー復元 =====
document.getElementById('show-header-btn').addEventListener('click', function() {
  document.getElementById('top-bar').classList.remove('hidden-bar');
  this.style.display = 'none';
});

// ===== Status通知 =====
function hideNotif() {
  const n = document.getElementById('status-notif');
  n.style.opacity = '0';
  n.style.transform = 'translateX(120%)';
  setTimeout(() => {
    n.style.display = 'none';
    setTimeout(() => {
      n.style.display = '';
      n.style.opacity = '1';
      n.style.transform = '';
    }, 8000);
  }, 300);
}

const msgs = [
  '🐹 カピバラチューブへようこそ！',
  '⚡ 複数サーバーで超高速再生！',
  '🎬 埋め込み禁止動画も再生できるよ！',
  '📱 スマホでも快適に使えます',
];
let mi = 0;
setInterval(() => {
  const el = document.getElementById('notif-content');
  if (!el || document.getElementById('status-notif').style.display === 'none') return;
  el.style.opacity = '0';
  setTimeout(() => {
    mi = (mi + 1) % msgs.length;
    el.textContent = msgs[mi];
    el.style.opacity = '1';
  }, 400);
}, 6000);

// ===== スワイプでメニュー =====
let sX = 0, sY = 0;
document.addEventListener('touchstart', e => {
  sX = e.touches[0].pageX; sY = e.touches[0].pageY;
}, { passive: true });
document.addEventListener('touchend', e => {
  const dX = sX - e.changedTouches[0].pageX;
  const dY = Math.abs(sY - e.changedTouches[0].pageY);
  if (dX > 50 && dY < 100) openPanel('menu-panel');
}, { passive: true });

// ===== オートコンプリート =====
const sb = document.getElementById('searchbox');
let suggestBox = null;
sb && sb.addEventListener('input', async function() {
  const q = this.value.trim();
  if (!q) { if (suggestBox) suggestBox.remove(); suggestBox = null; return; }
  try {
    const r = await fetch('/suggest?keyword=' + encodeURIComponent(q));
    const data = await r.json();
    if (suggestBox) suggestBox.remove();
    if (!data.length) { suggestBox = null; return; }
    suggestBox = document.createElement('div');
    suggestBox.style.cssText = 'position:fixed;z-index:600;background:#1a1a1a;border:1px solid #444;border-radius:8px;width:' + document.getElementById('header-search-wrap').offsetWidth + 'px;box-shadow:0 8px 24px rgba(0,0,0,0.6)';
    const rect = document.getElementById('header-search-wrap').getBoundingClientRect();
    suggestBox.style.top = (rect.bottom + 4) + 'px';
    suggestBox.style.left = rect.left + 'px';
    data.forEach(s => {
      const div = document.createElement('div');
      div.textContent = s;
      div.style.cssText = 'padding:10px 16px;cursor:pointer;font-size:14px;color:#f1f1f1;transition:background 0.1s';
      div.addEventListener('mouseenter', () => div.style.background = '#272727');
      div.addEventListener('mouseleave', () => div.style.background = '');
      div.addEventListener('click', () => {
        sb.value = s;
        document.getElementById('search-form').submit();
      });
      suggestBox.appendChild(div);
    });
    document.body.appendChild(suggestBox);
  } catch(e) {}
});
document.addEventListener('click', e => {
  if (suggestBox && !suggestBox.contains(e.target) && e.target !== sb) {
    suggestBox.remove(); suggestBox = null;
  }
});
</script>

{% block extra_script %}{% endblock %}
</body>
</html>
